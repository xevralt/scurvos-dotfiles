
# Wallpaper-aware lock screen
general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = $TIME
    color = rgb(e8e2d4)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(e8e2d4)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = rgb(e8e2d4)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -65
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(b0c4de)
    inner_color = rgb(15130c)
    font_color = rgb(e8e2d4)
    fade_on_empty = false
    rounding = 12
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    placeholder_text = <i>Enter password...</i>
    fail_text = <i>$FAIL</i>
    position = 0, -150
    halign = center
    valign = center
}

