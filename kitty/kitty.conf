# Font
font_family JetBrainsMono Nerd Font
font_size 11.0

# Appearance
background_opacity 0.92
confirm_os_window_close 0

# Matugen-generated colors
include ~/.cache/matugen/kitty-colors.conf


# ── Hyprland Rice: Kitty polish ──

# Typography
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.5

# Compact terminal spacing
remember_window_size yes
initial_window_width 110c
initial_window_height 32c
window_padding_width 10
single_window_padding_width 10
window_margin_width 0

# Clean terminal chrome
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_title_template "{title}"

# URL handling
detect_urls yes
url_style curly

# Performance and usability
repaint_delay 8
input_delay 3
sync_to_monitor yes
```

**Important:** if you already have conflicting settings, the appended values take precedence. Don't remove your existing Matugen-generated color include or color definitions.

Save with `:wq`.

## Step 2 — Reload Kitty

In a Kitty terminal, press:

`Ctrl + Shift + F5`

That reloads the configuration without closing your terminal.

If Kitty reports unknown options, don't guess or remove unrelated settings—send me the error and we'll adapt it to your installed version.

## Step 3 — Tell me how it looks

Check the font, padding, cursor, and tab bar. Once you're happy, we'll refine Kitty's background transparency and shell integration, then commit and **push** the finished configuration to GitHub. Matugen colors stay for the final pass.

# ── Visual polish ──
background_opacity 0.92
dynamic_background_opacity yes

# ── Shell integration ──
shell_integration enabled

# ── Clean window behavior ──
inactive_text_alpha 0.85
allow_remote_control no
